# Publish a tagged Android release: upload the signed bundle to Play's internal testing track as
# a draft and create the GitHub release. Started by cut-android.yml; run it by hand to retry a
# tag. Roll the draft out and promote it in the Play Console.
name: publish android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. android-v1.0.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Restore signing key and Firebase config
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          base64 --decode <<< "$ANDROID_KEYSTORE" > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Upload to Play
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:publishReleaseBundle --release-status draft
          "-Platr.storeFile=$RUNNER_TEMP/upload.jks"
          "-Platr.storePassword=$STORE_PASSWORD"
          "-Platr.keyAlias=$KEY_ALIAS"
          "-Platr.keyPassword=$KEY_PASSWORD"
      # A release made with this token doesn't fire the web deploy's on:release.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # notes cover only what changed since the last Android release
          if previous=$(git describe --tags --abbrev=0 --match "android-v*" "$TAG^" 2>/dev/null); then
            gh release create "$TAG" --generate-notes --verify-tag --notes-start-tag "$previous"
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi
