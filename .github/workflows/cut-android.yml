# Cut an Android release: bump the version on main, tag it, then start publish-android.yml on
# the tag.
name: cut android

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/build.yml
    with:
      product: android

  cut:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump + tag
      actions: write # start the publish
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the branch tip, not the dispatch SHA
      - name: Bump
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          gradle=android/app/build.gradle.kts
          current=$(sed -nE 's/^ *versionName = "([^"]+)"/\1/p' "$gradle")
          code=$(sed -nE 's/^ *versionCode = ([0-9]+)/\1/p' "$gradle")
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((${patch:-0} + 1))" ;;
          esac
          # Play rejects a versionCode it has already seen, so it only ever goes up
          sed -i -E \
            -e "s/^( *versionName = )\"[^\"]+\"/\1\"$version\"/" \
            -e "s/^( *versionCode = )[0-9]+/\1$((code + 1))/" \
            "$gradle"
          echo "tag=android-v$version" >> "$GITHUB_OUTPUT"
      - name: Tag and start the publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "$TAG"
          # branch first, tag second (never --follow-tags): a moved main is rejected before the tag exists
          git push origin HEAD:main
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          # a tag pushed with this token doesn't fire on:push, so start it directly
          gh workflow run publish-android.yml --ref main -f tag="$TAG"
