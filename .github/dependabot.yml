version: 2
updates:
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: monthly
    groups:
      svelte:
        patterns:
          - svelte
          - svelte-check
          - "@sveltejs/*"
  - package-ecosystem: bun
    directory: /firebase
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
